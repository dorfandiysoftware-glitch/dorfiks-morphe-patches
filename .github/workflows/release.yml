name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Tag, e.g. v1.0.0-test1"
        required: true

permissions:
  contents: write
  packages: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build the patches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid --no-daemon

      - name: Get Morphe Desktop and HeliBoard 4.2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir work
          gh release download v2.3.0 -R MorpheApp/morphe-desktop -p '*-all.jar' -D work
          curl -fsSL -o work/HeliBoard_4.2-release.apk \
            https://github.com/HeliBorg/HeliBoard/releases/download/v4.2/HeliBoard_4.2-release.apk
          find . -name "*.mpp" -not -path "./work/*"; cp "$(find patches/build -name "*.mpp" | head -1)" work/bundle.mpp
          ls -la work

      - name: Patch HeliBoard (checks the patch really applies)
        working-directory: work
        run: |
          java -jar morphe-desktop-*-all.jar patch -p bundle.mpp HeliBoard_4.2-release.apk 2>&1 | tee patch.log
          ls -la

      - name: Name the files
        run: |
          mkdir out
          cp work/bundle.mpp "out/Dorfik-Patches-${{ github.event.inputs.version }}.mpp"
          cp "$(find work/HeliBoard -name "*.apk" | head -1)" "out/HeliBoard-4.2-blur-${{ github.event.inputs.version }}.apk"
          cp work/patch.log out/patch.log

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: Dorfik Morphe Patches ${{ github.event.inputs.version }}
          prerelease: true
          files: out/*
